name: Deploy to Vercel Production

# Auto-deploys meethayat.com to Vercel production on every push to main.
# Added 2026-05-18 — the Vercel project had no native GitHub link, so
# scheduled content (answer pages, blog refreshes) pushed but never went live.
# Source deploy (Vercel builds server-side) — matches the native integration.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.indexing-cache.json'   # cache-only commits must not retrigger a deploy (loop guard)
  workflow_dispatch:

concurrency:
  group: deploy-meethayat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      # ---- Search-engine indexing (IndexNow + Google Indexing API) ----
      - name: Restore Google indexing key
        run: printf '%s' "$GCP_INDEXING_KEY" > .gcp-indexing-key.json
        env:
          GCP_INDEXING_KEY: ${{ secrets.GCP_INDEXING_KEY }}

      - name: Install indexing dependency
        run: npm install --no-save --silent googleapis@^144

      - name: Notify Google Indexing API + IndexNow
        run: node scripts/notify-indexing.js
        continue-on-error: true

      - name: Persist indexing cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .gcp-indexing-key.json
          git add .indexing-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No cache change to commit."
          else
            git commit -m "chore(indexing): update indexing cache after deploy [skip ci]"
            git push origin HEAD:main
          fi
